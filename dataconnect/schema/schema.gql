# Schema do Firebase Data Connect (SQL Connect) para E-commerce

# Tabela de Usuários
type User @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  email: String! @unique
  cpf: String! @unique
  phone: String
}

# Tabela de Endereços
type Address @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  cep: String!
  street: String!
  number: String!
  complement: String
  neighborhood: String!
  city: String!
  state: String!
  isDefault: Boolean @default(value: false)
}

# Tabela de Categorias
type Category @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  slug: String! @unique
  description: String
}

# Tabela de Produtos
type Product @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  slug: String! @unique
  description: String
  price: Float!
  stockQuantity: Int!
  category: Category
  imageUrl: String
}

# Tabela de Imagens de Produtos (Galeria)
type ProductImage @table {
  id: UUID! @default(expr: "uuidV4()")
  product: Product!
  imageUrl: String!
  isMain: Boolean @default(value: false)
}

# Tabela de Variações de Produtos (ex: tamanho, cor)
type ProductVariation @table @unique(fields: ["product", "name", "value"]) {
  id: UUID! @default(expr: "uuidV4()")
  product: Product!
  name: String! # ex: "Cor", "Tamanho"
  value: String! # ex: "Vermelho", "P"
  additionalPrice: Float @default(value: 0)
  stockQuantity: Int!
}

# Tabela de Carrinhos (um carrinho por usuário)
type Cart @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @unique
}

# Tabela de Itens do Carrinho
type CartItem @table {
  id: UUID! @default(expr: "uuidV4()")
  cart: Cart!
  product: Product!
  variation: ProductVariation # Opcional
  quantity: Int!
  priceAtAddition: Float!
}

# Enums para Status e Métodos de Pagamento
enum OrderStatus {
  PENDING
  PROCESSING
  SHIPPED
  DELIVERED
  CANCELLED
  PAID
}

enum PaymentMethod {
  PIX
  CREDIT_CARD
}

# Tabela de Pedidos
type Order @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  address: Address!
  totalAmount: Float!
  shippingCost: Float @default(value: 0)
  status: OrderStatus! @default(value: PENDING)
  paymentMethod: PaymentMethod!
  pixCode: String # Código Pix gerado
  shippingOption: ShippingOption
}

# Tabela de Itens do Pedido
type OrderItem @table {
  id: UUID! @default(expr: "uuidV4()")
  order: Order!
  product: Product!
  variation: ProductVariation
  productName: String!
  variationName: String
  quantity: Int!
  unitPrice: Float!
}

# Tabela de Opções de Entrega
type ShippingOption @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
  price: Float!
  estimatedDeliveryDays: Int
}
